appId: dev.blossomstrap.app
productName: Blossom Strap
copyright: Blossom Strap

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/{test,__tests__,tests,example,examples,doc,docs}/**'
  # The tests' copy of the SQLite binary, built for Node's ABI rather than
  # Electron's. The app would never load it, so it is not worth shipping.
  - '!**/node_modules/better-sqlite3/build/Release-node/**'

# better-sqlite3 is native, but `npm install` already put an Electron-ABI
# binary in place (tools/prepare-native.mjs downloads the published one), so
# packaging has nothing to build. Leaving this on would invoke node-gyp and
# demand a C++ toolchain to produce the binary that is already there.
npmRebuild: false
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

extraResources:
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: BlossomStrap-${version}-${arch}.${ext}
  # Blossom writes only to the user's own profile directory, so it never needs
  # to ask for administrator rights.
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Blossom Strap
  # Uninstalling must leave nothing behind that Blossom created in Roblox's
  # folders; the application removes those itself on first-run reconciliation.
  deleteAppDataOnUninstall: false

publish: null
